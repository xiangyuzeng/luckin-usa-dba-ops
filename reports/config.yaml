# Luckin Coffee NA — Weekly Ops Report Generator configuration
# ---------------------------------------------------------------
# Supports ${ENV_VAR} substitution; use it for secrets so they stay
# out of version control.

database:
  # Each business schema lives on its own RDS instance.
  luckyus_sales_order:
    host: aws-luckyus-salesorder-rw.cxwu08m2qypw.us-east-1.rds.amazonaws.com
    port: 3306
    user: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  luckyus_iluckyhealth:
    host: aws-luckyus-iluckyhealth-rw.cxwu08m2qypw.us-east-1.rds.amazonaws.com
    port: 3306
    user: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  luckyus_opshop:
    host: aws-luckyus-opshop-rw.cxwu08m2qypw.us-east-1.rds.amazonaws.com
    port: 3306
    user: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  # Connection defaults applied to every schema above.
  defaults:
    charset: utf8mb4
    connect_timeout: 10
    read_timeout: 30

output:
  dir: ./reports
  font_path: ${HOME}/.fonts/NotoSansCJK-Regular.ttc
  action_items: action_items.yaml
